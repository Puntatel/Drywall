<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise Drywall Calc{% endblock %}</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --success: #27ae60;
            --danger: #e74c3c;
            --light: #f8f9fa;
            --border: #dcdde1;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f1f2f6; color: #2f3640; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2, h3, h4 { color: var(--primary); margin-top: 0; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; text-align: center; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-control { padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 10px; border: 1px solid var(--border); text-align: left; }
        th { background: var(--secondary); color: white; }
        tr:nth-child(even) { background: var(--light); }
        .badge { padding: 3px 7px; border-radius: 3px; font-size: 11px; font-weight: bold; color: white; }
        .badge-success { background: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <header style="border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 24px; color: var(--primary);">Drywall Calc Enterprise</h1>
        </header>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
